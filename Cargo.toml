[workspace]
members = ["."]
resolver = "2"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
too-many-arguments = "allow"
type-complexity = "allow"

[package]
name = "typsite"
version = "0.1.7"
edition = "2024"
description = "Build and development environment for Typsite"
rust-version = "1.89"

[dependencies]
clap = { version = "4.5.38", features = ["std", "derive"] }
syntect = { version = "5.2.0", features = ["plist-load", "metadata"] }
html5gum = { version = "0.7.0" }
aho-corasick = "1.1.3"
include_dir = "0.7.4"
walkdir = "2.5.0"
anyhow = "1.0.98"
thiserror = "2.0.12"
serde = { version = "*", default-features = false, features = ["derive"] }
rayon = "1.10.0"
blake3 = { version = "1.8.2", features = ["rayon"] }
serde_json = "1.0.140"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
toml = "*"
plist = "*"
home = "*"
