[workspace]
members = ["."]
resolver = "2"



[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
too-many-arguments = "allow"
type-complexity = "allow"

[package]
name = "typsite"
version = "0.1.8"
description = "A Typst-based static site generator with incremental builds and live preview"
edition = "2024"
rust-version = "1.89"

[dependencies]
clap = { version = "4.5.38", features = ["std","derive"] }
syntect = { version = "5.2.0", features = ["plist-load", "metadata"]}
html5gum = { version = "0.7.0"}
aho-corasick = "1.1.3"
include_dir = "0.7.4"
walkdir = "2.5.0"
anyhow = "1.0.98"
thiserror = "2.0.12"
serde = { version = "*", default-features = false, features = ["derive", "rc"] }
rayon = "1.10.0"
blake3 = { version = "1.8.2", features = ["rayon"] }
serde_json = "1.0.140"
bincode = "1.3.3"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
toml = "*"
plist = "*"
home = "*"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
url = "2.5.8"

[build-dependencies]
blake3 = "1.8.2"

[dev-dependencies]
quick-xml = "0.32.0"
