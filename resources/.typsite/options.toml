[default_metadata.content]
# you can add any default metadata you want here
title = "Untitled"
taxon = ""
date = "Unknown Date"
author = "Unknown Author"
sidebar = "true"
show-metadata = "true"
[default_metadata.options]
heading_numbering = "Bullet" # Bullet | Roman | Alphabet | None
[default_metadata.graph]
parent = "" # the default parent page

[typst_lib]
# where the typst library is located, those typst files won't be compiled to html
# but will be available for import in the typst files
# if ends with `/`, it's considerred as a directory
paths = [ "lib/" ]

[code_fallback_style]
dark = "#d3c6aa"
light = "#5c6a72"

[site]
# Set your public HTTP(S) URL to enable RSS and sitemap; blank disables both.
# Example: base_url = "https://example.org"
base_url = ""
title = ""
description = ""
# Output paths are relative to publish/, with an optional leading slash.
# Set rss_path = "" or rss_limit = 0 to disable RSS only.
rss_path = "/rss.xml"
sitemap_path = "/sitemap.xml"
rss_limit = 20
# "summary": description/summary/abstract metadata and links (default).
# "full": also include composed article HTML as content:encoded.
rss_content = "summary"
