name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            typst: '0.15.1'
          - os: ubuntu-latest
            typst: latest
          - os: windows-latest
            typst: latest
          - os: macos-latest
            typst: latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.typst }}
      - run: typst --version
      - run: cargo test --workspace --all-targets --locked
      - name: Real Typst compatibility (including bundled helpers and SVG frames)
        run: cargo test --test typst_latest --locked -- --ignored
